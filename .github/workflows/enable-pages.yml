name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists"
            cat /tmp/pages.json
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f 'source[branch]=main' -f 'source[path]=/'
