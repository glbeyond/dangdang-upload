<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title data-i18n="title">dangdang 批次影像上传</title>
<style>
  :root { --pri:#1a73e8; --ok:#188038; --err:#d93025; --bg:#f4f6f9; --card:#fff; --line:#dfe3ea; --txt:#1f2328; --sub:#667085; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; }
  header { position:relative; background:var(--pri); color:#fff; padding:14px 16px calc(14px) ; padding-top:max(14px, env(safe-area-inset-top)); padding-right:110px; }
  .lang { position:absolute; right:12px; top:max(12px, env(safe-area-inset-top)); display:flex; border:1px solid rgba(255,255,255,.7); border-radius:18px; overflow:hidden; }
  .lang button { border:0; background:transparent; color:#fff; font-size:14px; font-weight:600; padding:0 12px; min-height:36px; min-width:44px; }
  .lang button.on { background:#fff; color:var(--pri); }
  header h1 { margin:0; font-size:19px; }
  header p { margin:2px 0 0; font-size:13px; opacity:.85; }
  main { padding:12px 12px calc(110px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  label.f { display:block; font-weight:600; margin:10px 0 6px; font-size:15px; }
  label.f:first-child { margin-top:0; }
  .req { color:var(--err); margin-left:2px; }
  input[type=text], select, textarea { width:100%; font-size:17px; padding:12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--txt); -webkit-appearance:none; appearance:none; }
  select { background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; }
  textarea { min-height:64px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid rgba(26,115,232,.35); border-color:var(--pri); }
  .row { display:flex; gap:8px; }
  .row > input { flex:1; min-width:0; }
  .chips { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .chips.two { grid-template-columns:repeat(2,1fr); }
  #channelCustom { margin-top:8px; }
  .scaninfo { font-size:13px; margin-top:6px; color:var(--sub); word-break:break-all; }
  .scaninfo b { color:var(--txt); }
  .scaninfo.warn { color:#b06000; }
  .bcard { margin-top:10px; border-radius:12px; padding:12px; font-size:15px; }
  .bcard.ok { background:#e6f4ea; border:1px solid #b7dfc2; }
  .bcard.miss { background:#fef7e0; border:1px solid #f6d77a; color:#7a5300; }
  .bcard.multi { background:#e8f0fe; border:1px solid #c3d6fb; }
  .bcard.load { background:#f1f3f4; color:var(--sub); }
  .bcard .g { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .bcard .g span:nth-child(odd) { color:var(--sub); white-space:nowrap; }
  .bcard .g span:nth-child(even) { font-weight:700; word-break:break-word; }
  .bcard .pick { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 12px; border:1px solid #c3d6fb;
    border-radius:10px; background:#fff; font-size:15px; min-height:48px; }
  .ver { text-align:center; font-size:11px; color:#9aa0a6; margin-top:4px; }
  .chip { min-height:54px; border:2px solid var(--line); background:#fff; border-radius:12px; font-size:17px; font-weight:700; color:var(--txt); }
  .chip.on { border-color:var(--pri); background:#e8f0fe; color:var(--pri); }
  button { font:inherit; cursor:pointer; }
  .btn { min-height:52px; padding:0 16px; border:0; border-radius:12px; font-size:17px; font-weight:600; background:#e8eaed; color:var(--txt); }
  .btn.pri { background:var(--pri); color:#fff; }
  .btn:disabled { opacity:.5; }
  .media-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .media-btns .big { min-height:84px; font-size:19px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .media-btns .big span { font-size:26px; line-height:1; }
  .media-btns .big b { font-weight:600; }
  .media-btns .wide { grid-column:1 / -1; min-height:52px; }
  .hint { color:var(--sub); font-size:13px; margin-top:6px; }
  .list { list-style:none; margin:10px 0 0; padding:0; }
  .item { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .thumb { width:72px; height:72px; flex:0 0 72px; border-radius:10px; object-fit:cover; background:#000; }
  .meta { flex:1; min-width:0; font-size:14px; }
  .meta .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .meta .st { color:var(--sub); font-size:13px; margin-top:2px; }
  .meta .st.ok { color:var(--ok); } .meta .st.err { color:var(--err); }
  .bar { height:6px; background:#eceff3; border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; width:0; background:var(--pri); transition:width .2s; }
  .item.done .bar i { background:var(--ok); }
  .item.fail .bar i { background:var(--err); }
  .x { width:44px; height:44px; border:0; border-radius:22px; background:#f1f3f4; font-size:20px; color:#5f6368; flex:0 0 44px; }
  .retry { height:40px; border:0; border-radius:10px; background:#fde7e9; color:var(--err); font-weight:700; padding:0 12px; }
  footer { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  footer .in { max-width:640px; margin:0 auto; }
  #submit { width:100%; min-height:58px; font-size:19px; }
  #summary { font-size:14px; text-align:center; margin-bottom:6px; color:var(--sub); min-height:20px; }
  #summary.ok { color:var(--ok); font-weight:700; } #summary.err { color:var(--err); font-weight:600; }
  .toast { position:fixed; left:50%; top:20px; transform:translateX(-50%); background:rgba(32,33,36,.92); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:15px; z-index:50; max-width:90%; text-align:center; display:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">dangdang 批次影像上传</h1>
  <p data-i18n="subtitle">整理好批次货物后，拍照/录像并确认上传</p>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="en" lang="en">EN</button>
  </div>
</header>

<main>
  <section class="card">
    <label class="f" for="operator"><span data-i18n="f_operator">操作人姓名</span><span class="req">*</span></label>
    <input type="text" id="operator" maxlength="40" placeholder="请输入你的姓名" data-i18n-ph="ph_operator" autocomplete="name">
    <div class="hint hidden" id="opHint"></div>

    <label class="f" for="cabinet"><span data-i18n="f_cabinet">柜号</span><span class="req">*</span></label>
    <input type="text" id="cabinet" maxlength="30" placeholder="例如 8.27" data-i18n-ph="ph_cabinet" inputmode="decimal">

    <label class="f"><span data-i18n="f_channel">渠道</span><span class="req">*</span></label>
    <div class="chips" id="channels">
      <button type="button" class="chip" data-v="UPS">UPS</button>
      <button type="button" class="chip" data-v="BRT">BRT</button>
      <button type="button" class="chip" data-v="RABEN">RABEN</button>
      <button type="button" class="chip" data-v="自提" data-i18n="ch_self">自提</button>
      <button type="button" class="chip" data-v="__custom" data-i18n="ch_custom">自定义</button>
    </div>
    <input type="text" id="channelCustom" class="hidden" maxlength="30" placeholder="请输入渠道名称，例如 GLS" data-i18n-ph="ph_channel">

    <label class="f" for="batch"><span data-i18n="f_batch">批次号</span><span class="req">*</span></label>
    <div class="row">
      <input type="text" id="batch" maxlength="80" placeholder="输入或扫码" data-i18n-ph="ph_batch" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button type="button" class="btn pri" id="scanBtn">📷 <span data-i18n="scan">扫码</span></button>
    </div>
    <div class="scaninfo hidden" id="scanInfo"></div>
    <div class="bcard hidden" id="batchCard"></div>

    <label class="f"><span data-i18n="f_shot">拍摄类型</span><span class="req">*</span></label>
    <div class="chips two" id="shotTypes">
      <button type="button" class="chip" data-v="数量确认" data-i18n="st_qty">数量确认</button>
      <button type="button" class="chip" data-v="打托完成" data-i18n="st_pallet">打托完成</button>
      <button type="button" class="chip" data-v="出货记录" data-i18n="st_ship">出货记录</button>
      <button type="button" class="chip" data-v="异常反馈" data-i18n="st_exc">异常反馈</button>
    </div>

    <label class="f" for="note" data-i18n="f_note">备注</label>
    <textarea id="note" maxlength="500" placeholder="可选，例如：外箱破损 2 件" data-i18n-ph="ph_note"></textarea>
  </section>

  <section class="card">
    <div class="media-btns">
      <button type="button" class="btn pri big" id="btnPhoto"><span>📷</span><b data-i18n="photo">拍照</b></button>
      <button type="button" class="btn pri big" id="btnVideo"><span>🎥</span><b data-i18n="video">录视频</b></button>
      <button type="button" class="btn wide" id="btnPick" data-i18n="pick">从相册选择</button>
    </div>
    <input type="file" id="inPhoto" accept="image/*" capture="environment" multiple class="hidden">
    <input type="file" id="inVideo" accept="video/*" capture="environment" class="hidden">
    <input type="file" id="inPick" accept="image/*,video/*" multiple class="hidden">
    <div class="hint" data-i18n="media_hint">照片会自动压缩（长边 2000 像素）；视频超过 300MB 会提示，建议单段控制在 1 分钟内。</div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<footer>
  <div class="in">
    <div id="summary"></div>
    <button type="button" class="btn pri" id="submit" disabled></button>
    <div class="ver" id="ver"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

    if (final !== undefined) state.final = final;        // 成功提示保存下来，切换语言时重新显示
    if (state.items.length) state.final = null;
    if (state.final) { s.className = 'ok'; s.textContent = t('sum_ok', state.final.n); }
    else if (!state.items.length) s.textContent = t('sum_none');
    else if (failed) { s.className = 'err'; s.textContent = t('sum_failed', failed); }
    else s.textContent = t('sum_selected', p.length);
    btn.disabled = !p.length;
    btn.textContent = failed ? t('btn_retry_failed') : t('btn_submit');
  }

  // ---------- 图片压缩 ----------
  function loadImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }
  function compressImage(it) {
    var f = it.file;
    if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(it.mime)) return Promise.resolve(null);
    return loadImage(f).then(function (img) {
      var w = img.naturalWidth, h = img.naturalHeight, edge = Math.max(w, h);
      if (!w || !h) return null;
      if (edge <= IMG_MAX_EDGE && f.size <= IMG_SKIP_BYTES && it.mime !== 'image/heic' && it.mime !== 'image/heif') return null;
      var scale = Math.min(1, IMG_MAX_EDGE / edge);
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (resolve) {
        c.toBlob(function (b) { resolve(b && b.size < f.size ? b : null); }, 'image/jpeg', IMG_QUALITY);
      });
    }).catch(function () { return null; }); // 解码失败就传原图
  }
  function prepare(it) {
    if (it.blob || it.kind !== 'image') return Promise.resolve();
    return compressImage(it).then(function (b) {
      if (b) { it.blob = b; it.mime = 'image/jpeg'; it.uploadName = it.file.name.replace(/\.[^.]+$/, '') + '.jpg'; }
    });
  }

  // ---------- 分块上传 ----------
  function blobToBase64(b) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { var s = String(r.result); resolve(s.slice(s.indexOf(',') + 1)); };
      r.onerror = function () { reject(codedError('E_READ_FILE')); };
      r.readAsDataURL(b);
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function readMeta() {
    return {
      operator: $('operator').value.trim(), cabinet: $('cabinet').value.trim(), channel: currentChannel(),
      batch: $('batch').value.trim(), shotType: state.shotType, note: $('note').value.trim()
    };
  }
  function validate(m) {
    if (!m.operator) return ['operator', 'v_operator'];
    if (!m.cabinet) return ['cabinet', 'v_cabinet'];
    if (!m.channel) return [state.channel === '__custom' ? 'channelCustom' : null, 'v_channel'];
    if (!m.batch) return ['batch', 'v_batch'];
    if (SHOT_TYPES.indexOf(m.shotType) < 0) return [null, 'v_shot'];
    return null;
  }

  function sendChunks(it) {
    var data = it.blob || it.file, total = data.size;
    function loop() {
      if (it.offset >= total) return Promise.reject(codedError('E_UPLOAD_END'));
      var end = Math.min(it.offset + CHUNK, total);
      var attempt = 0;
      function tryOnce() {
        return blobToBase64(data.slice(it.offset, end))
          .then(function (b64) { return call('uploadChunk', it.uploadId, it.offset, b64); })
          .catch(function (e) {
            attempt++;
            if (attempt > MAX_RETRY || isExpired(parseErr(e))) throw e;
            return sleep(1000 * attempt)
              .then(function () { return call('queryUpload', it.uploadId); })
              .then(function (r) {
                if (r && r.done) return r;
                it.offset = r.next; end = Math.min(it.offset + CHUNK, total);
                return tryOnce();
              }, function () { return tryOnce(); });
          });
      }
      return tryOnce().then(function (r) {
        if (r && r.done) { it.progress = 1; return r; }
        it.offset = r.next; it.progress = it.offset / total; updateProgress(it);
        return loop();
      });
    }
    return loop();
  }

  function uploadOne(it, meta, ctx) {
    it.status = 'prep'; it.err = null; render();
    return prepare(it).then(function () {
      it.status = 'up'; render();
      if (it.uploadId) {
        // 断点续传：先问服务器已经收到多少
        return call('queryUpload', it.uploadId).then(function (r) {
          if (r.done) return r;
          it.offset = r.next; return sendChunks(it);
        }, function () { it.uploadId = null; it.offset = 0; return uploadOne2(it, meta, ctx); });
      }
      return uploadOne2(it, meta, ctx);
    }).then(function () {
      it.status = 'done'; it.progress = 1; render();
    }).catch(function (e) {
      it.status = 'fail'; it.err = parseErr(e);
      if (isExpired(it.err)) { it.uploadId = null; it.offset = 0; it.progress = 0; }
      render();
    });
  }
  function uploadOne2(it, meta, ctx) {
    var data = it.blob || it.file;
    var info = { name: it.uploadName || it.file.name, mimeType: it.mime, size: data.size, seq: ++ctx.seq };
    return call('startUpload', meta, info, ctx.ts).then(function (r) {
      ctx.ts = r.ts; it.uploadId = r.uploadId; it.offset = 0;
      return sendChunks(it);
    });
  }

  function startUploadAll() {
    if (state.uploading) return;
    var meta = readMeta(), bad = validate(meta);
    if (bad) { toast(bad[1]); if (bad[0]) $(bad[0]).focus(); return; }
    store('operator', meta.operator); store('cabinet', meta.cabinet); store('channel', meta.channel);
    var todo = pending();
    if (!todo.length) return;
    state.uploading = true; render();
    var ctx = { ts: null, seq: state.items.length - todo.length };
    var chain = Promise.resolve();
    todo.forEach(function (it) { chain = chain.then(function () { return uploadOne(it, meta, ctx); }); });
    chain.then(function () {
      state.uploading = false;
      var ok = state.items.filter(function (it) { return it.status === 'done'; }).length;
      var failed = state.items.filter(function (it) { return it.status === 'fail'; }).length;
      if (!failed) {
        state.items.forEach(function (it) { URL.revokeObjectURL(it.url); });
        state.items = [];
        render();
        updateFooter({ n: ok });
        toast('toast_ok', ok);
      } else {
        render();
      }
    });
  }
  $('submit').addEventListener('click', startUploadAll);

  window.addEventListener('beforeunload', function (e) {
    if (state.uploading) { e.preventDefault(); e.returnValue = t('leave'); return e.returnValue; }
  });

  // ---------- 切换语言：只重绘文字，不动表单值、已选文件和批次卡片数据 ----------
  function applyLang(l) {
    lang = l === 'en' ? 'en' : 'zh';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    document.title = t('title');
    $('ver').textContent = t('footer', VERSION);
    renderCard(); renderScanInfo(); renderOpHint();
    if (toast._spec && $('toast').style.display === 'block') $('toast').textContent = t.apply(null, toast._spec);
    render();                       // 文件列表和底部按钮（render 会调用 updateFooter）
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
  });

  applyLang(lang);
})();
</script>
</body>
</html>
