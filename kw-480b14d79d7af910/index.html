<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1915">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>fest7 库位查询</title>
<style>
:root {
  --bg: #f4f1ea;
  --paper: #fffdf8;
  --ink: #1c1915;
  --muted: #6b645b;
  --line: #e4ddd2;
  --accent: #1f5c4d;
  --accent-soft: #e7f2ee;
  --warn: #8a3a16;
  --warn-bg: #f8eadf;
  --focus: #1f5c4d;
  --scan: #1a73e8;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
body.scanning { overflow: hidden; }
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(28,25,21,.04);
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 14px 16px; }
h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: .02em; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.note strong { color: var(--ink); font-weight: 600; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; margin-top: 12px; }
.modes { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; flex-wrap: wrap; }
.modes button {
  border: 0; background: transparent; color: var(--muted);
  padding: 10px 14px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 650;
  min-height: 44px;
}
.modes button[aria-pressed="true"] { background: var(--paper); color: var(--accent); box-shadow: 0 1px 2px rgba(28,25,21,.08); }
.search { flex: 1; min-width: 200px; position: relative; }
.search input {
  width: 100%; height: 48px; padding: 10px 44px 10px 14px; border: 1px solid var(--line);
  border-radius: 12px; font: inherit; font-size: 16px; background: #fff; color: var(--ink);
  outline: none; -webkit-appearance: none;
}
.search input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(31,92,77,.15); }
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  width: 36px; height: 36px; border-radius: 8px; font-size: 22px; line-height: 1;
}
.search .clear:hover { background: var(--bg); color: var(--ink); }
.scan-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#scanBtn {
  border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700;
  font-size: 16px; padding: 0 18px; height: 48px; border-radius: 12px; cursor: pointer;
  min-width: 112px;
}
#scanBtn:active { transform: scale(.98); }
.cont-lab {
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  padding: 0 12px; height: 48px; user-select: none; cursor: pointer;
}
.cont-lab input { width: 18px; height: 18px; accent-color: var(--accent); }
#httpsWarn {
  margin-top: 10px; background: var(--warn-bg); color: var(--warn);
  border-radius: 10px; padding: 10px 12px; font-size: 13px;
}
#httpsWarn[hidden] { display: none !important; }
.hint-row { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
main.wrap { padding-top: 16px; padding-bottom: 56px; }
.sum-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; color: var(--muted);
}
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 16px; }
.resolved { font-size: 14px; margin: 0 0 10px; color: var(--accent); font-weight: 650; }
.empty { color: var(--muted); padding: 32px 8px; text-align: center; font-size: 15px; }
.query-echo { display: inline-block; margin-top: 8px; font-weight: 700; color: var(--ink); font-size: 18px; }
h2 { font-size: 15px; font-weight: 700; margin: 18px 0 10px; color: var(--ink); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; background: var(--paper);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: 14px; }
th { font-weight: 650; color: var(--muted); background: #f7f3ec; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: 0; }
.linkish { color: var(--accent); cursor: pointer; background: none; border: 0;
  padding: 0; font: inherit; font-weight: 700; text-align: left; font-size: 16px; }
.linkish:hover { text-decoration: underline; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 650; }
.badge.def { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.sku { font-weight: 700; }
.sub, .bar { font-size: 13px; }
.sub { color: var(--muted); }
.hint { margin: 8px 0; color: var(--muted); font-size: 12px; }

/* 手机卡片；桌面用表格 */
.cards { display: none; gap: 10px; flex-direction: column; }
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 12px; box-shadow: 0 1px 2px rgba(28,25,21,.04);
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-main .linkish { font-size: 22px; letter-spacing: .01em; line-height: 1.25; word-break: break-all; }
.card-qty { text-align: right; flex-shrink: 0; }
.card-qty b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.1; }
.card-qty span { font-size: 12px; color: var(--muted); }
.card-sub { margin-top: 6px; font-size: 16px; }
.card-sub .linkish { font-size: 18px; }
.card-name { margin-top: 4px; color: var(--ink); font-size: 15px; }
.card-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
.card-nums { display: flex; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 14px; }
.card-nums b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 16px; }

@media (max-width: 720px) {
  .wrap { padding: 12px 12px; }
  h1 { font-size: 22px; }
  .controls { flex-direction: column; }
  .modes { width: 100%; }
  .modes button { flex: 1; }
  .scan-actions { width: 100%; }
  #scanBtn { flex: 1; height: 52px; font-size: 18px; }
  .cont-lab { flex: 1; justify-content: center; height: 52px; }
  .cards { display: flex; }
  .table-wrap { display: none; }
  th.col-hide, td.col-hide { display: none; }
}
@media (min-width: 721px) {
  .cards { display: none; }
  .table-wrap { display: block; }
}

/* ---------- 扫码层（dangdang 取景样式，内嵌全屏） ---------- */
#scanOverlay {
  position: fixed; inset: 0; z-index: 2000; background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#scanOverlay[hidden] { display: none !important; }
#scanOverlay #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
#scanOverlay #top {
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  text-align: center; font-size: 15px; line-height: 1.5; min-height: 44px;
}
#scanOverlay #stage { flex: 1; position: relative; overflow: hidden; min-height: 200px; touch-action: none; }
#scanOverlay #vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
#scanOverlay #box {
  position: absolute; border: 3px solid #fff; border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; transition: border-color .15s;
}
#scanOverlay #box.ok { border-color: #34a853; }
#scanOverlay #box i { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: rgba(234,67,53,.85); }
#scanOverlay #hint {
  position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
  font-size: 13px; color: #ddd; pointer-events: none; padding: 0 12px;
}
#scanOverlay #ring {
  position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px;
  border: 2px solid #fbbc04; border-radius: 50%; display: none; pointer-events: none;
}
#scanOverlay #msg {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  text-align: center; padding: 24px; font-size: 16px; line-height: 1.6; background: #000; z-index: 5;
}
#scanOverlay #msg small { display: block; color: #aaa; font-size: 13px; margin-top: 8px; word-break: break-all; }
#scanOverlay #scanResult {
  background: #111; color: #fff; padding: 10px 14px 8px;
  max-height: 34vh; overflow: auto; -webkit-overflow-scrolling: touch;
  border-top: 1px solid #333;
}
#scanOverlay #scanResult[hidden] { display: none !important; }
#scanOverlay .sp-title { font-size: 18px; font-weight: 700; word-break: break-all; }
#scanOverlay .sp-sum { color: #c8c8c8; font-size: 13px; margin: 4px 0 8px; }
#scanOverlay .sp-sum b { color: #fff; font-size: 18px; font-variant-numeric: tabular-nums; }
#scanOverlay .sp-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid #2a2a2a; font-size: 16px; }
#scanOverlay .sp-key { font-weight: 700; flex: 0 1 auto; }
#scanOverlay .sp-name { flex: 1; color: #bbb; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#scanOverlay .sp-qty { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
#scanOverlay .sp-more, #scanOverlay .sp-miss { color: #f9ab00; margin-top: 6px; font-size: 14px; }
#scanOverlay .sp-miss b { color: #fff; font-size: 18px; }
#scanOverlay #zoomRow { display: flex; align-items: center; gap: 10px; padding: 6px 16px 0; }
#scanOverlay #zoomRow[hidden] { display: none; }
#scanOverlay #zoomRow input { flex: 1; }
#scanOverlay #zv { min-width: 44px; text-align: right; font-size: 14px; }
#scanOverlay #eng { font-size: 11px; color: #9aa0a6; text-align: center; padding: 4px 8px 0; min-height: 18px; word-break: break-all; }
#scanOverlay #contBar {
  display: flex; align-items: center; justify-content: center;
  padding: 4px 16px 0; font-size: 14px;
}
#scanOverlay #contBar label { display: inline-flex; align-items: center; gap: 8px; }
#scanOverlay #contBar input { width: 18px; height: 18px; }
#scanOverlay #bot {
  display: flex; gap: 10px; padding: 10px 14px 14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
}
#scanOverlay #bot button {
  flex: 1; font-size: 16px; padding: 14px 8px; border-radius: 10px; border: 0;
  background: #3c4043; color: #fff;
}
#scanOverlay #bot button.pri { background: #1a73e8; }
#scanOverlay #bot button.on { background: #f9ab00; color: #000; }
#scanOverlay #bot button[hidden] { display: none; }


.data-time { font-size: 17px; font-weight: 700; margin: 8px 0 2px; color: var(--ink); letter-spacing: .01em; }
.data-time b { font-variant-numeric: tabular-nums; }
.data-sub { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
.data-sub strong { color: var(--ink); font-weight: 600; }
.sync-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0 2px; }
#syncBtn {
  border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  font: inherit; font-weight: 700; font-size: 14px; padding: 0 14px; height: 40px;
  border-radius: 10px; cursor: pointer;
}
#syncBtn:disabled { opacity: .65; cursor: wait; }
#syncBtn:active { transform: scale(.98); }
#syncStatus { font-size: 13px; color: var(--accent); }
#syncStatus.is-err { color: var(--warn); }
#syncStatus.is-muted { color: var(--muted); }
.sync-help { color: var(--muted); font-size: 12px; margin: 0 0 2px; }
#multiBar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-top: 10px;
}
#multiBar[hidden] { display: none !important; }
#multiCount { font-size: 14px; font-weight: 650; }
#multiClear {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  font: inherit; font-weight: 650; padding: 6px 14px; border-radius: 10px; cursor: pointer;
  min-height: 36px;
}
#multiClear:disabled { opacity: .5; cursor: default; }
.acc-block {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px 16px; margin: 0 0 14px;
}
.acc-block.flash { animation: accflash 1.1s ease; }
@keyframes accflash {
  0% { box-shadow: 0 0 0 3px rgba(31,92,77,.4); background: var(--accent-soft); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.acc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.acc-head h2 { margin: 0; font-size: 18px; }
.acc-k { color: var(--muted); font-size: 13px; font-weight: 650; margin-right: 6px; }
.acc-code { font-size: 20px; letter-spacing: .01em; word-break: break-all; }
.acc-qty { color: var(--muted); font-size: 14px; }
.acc-qty b { color: var(--accent); font-size: 22px; font-variant-numeric: tabular-nums; }
.retry-btn {
  margin-top: 12px; border: 1px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); font: inherit; font-weight: 700; padding: 8px 16px;
  border-radius: 10px; cursor: pointer;
}
@media (max-width: 720px) {
  .data-time { font-size: 18px; }
  #syncBtn { height: 44px; }
}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>fest7 库位查询</h1>
    <p class="data-time" id="dataTime">数据更新时间：<b>—</b></p>
    <p class="data-sub" id="dataMeta">正在加载库存数据…</p>
    <div class="sync-row">
      <button type="button" id="syncBtn">一键同步</button>
      <span id="syncStatus"></span>
    </div>
    <p class="sync-help">一键同步会拉取服务器上最近一次整点上传的库位数据，不会触发领星 WMS 导出。页面打开期间每 10 分钟自动检查一次。</p>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <div class="modes" role="tablist" aria-label="查询方式">
        <button type="button" id="mode-auto" aria-pressed="true">自动识别</button>
        <button type="button" id="mode-sku" aria-pressed="false">搜 SKU</button>
        <button type="button" id="mode-loc" aria-pressed="false">搜库位</button>
      </div>
      <div class="search">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="扫描或输入 SKU、条码或库位" autofocus>
        <button type="button" class="clear" id="clear" hidden title="清除">×</button>
      </div>
      <div class="scan-actions">
        <label class="cont-lab"><input type="checkbox" id="multiSku"> 多SKU连续查询</label>
        <button type="button" id="scanBtn">📷 扫码</button>
        <label class="cont-lab"><input type="checkbox" id="continuous"> <span id="contLabel">连续扫描</span></label>
      </div>
    </div>
    <div id="multiBar" hidden>
      <span id="multiCount">已查询 0 个</span>
      <button type="button" id="multiClear">清空</button>
    </div>
    <div id="httpsWarn" hidden></div>
    <p class="hint-row">手机请用系统浏览器（Chrome / Safari）打开；微信或企业微信内置浏览器的摄像头权限可能不稳定。扫码需要 https。扫码枪对准输入框扫描后回车即可。勾选「多SKU连续查询」后，每次扫码或回车会把结果追加在下方。</p>
  </div>
</header>
<main class="wrap">
  <div id="summary"></div>
  <div id="result"></div>
</main>

<div id="scanOverlay" hidden>
  <div id="wrap">
    <div id="top"></div>
    <div id="stage">
      <video id="vid" playsinline muted autoplay></video>
      <div id="box"><i></i></div>
      <div id="ring"></div>
      <div id="hint"></div>
      <div id="msg"></div>
    </div>
    <div id="scanResult" hidden></div>
    <div id="zoomRow" hidden><span id="zl"></span><input id="zoom" type="range"><span id="zv"></span></div>
    <div id="eng"></div>
    <div id="contBar"><label><input type="checkbox" id="bCont"> 连续扫描</label></div>
    <div id="bot">
      <button type="button" id="bCancel"></button>
      <button type="button" id="bTorch" hidden></button>
      <button type="button" id="bSwitch" class="pri" hidden></button>
    </div>
  </div>
</div>

<script id="payload" type="application/json">null</script>
<script>
/* fest7 库位查询：检索与自动识别（页面与测试共用） */
(function (root) {
  'use strict';

  function normalize(s) {
    return String(s == null ? '' : s).trim().toLowerCase();
  }

  function buildRecords(DATA) {
    var skus = DATA.skus;
    var skuBarcodes = DATA.skuBarcodes;
    var names = DATA.names;
    var customers = DATA.customers;
    var locations = DATA.locations;
    var areas = DATA.areas;
    var stockProperties = DATA.stockProperties;
    var rows = DATA.rows;
    var out = new Array(rows.length);
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var sku = skus[r[0]];
      var bar = skuBarcodes[r[0]] || sku;
      out[i] = {
        sku: sku,
        barcode: bar,
        name: names[r[1]],
        customer: customers[r[2]],
        location: locations[r[3]],
        area: areas[r[4]],
        prop: stockProperties[r[5]],
        total: r[6],
        avail: r[7],
        locked: r[8],
        skuL: sku.toLowerCase(),
        barL: bar.toLowerCase(),
        locL: locations[r[3]].toLowerCase()
      };
    }
    return out;
  }

  /**
   * mode: 'auto' | 'sku' | 'loc'
   * 自动识别：精确匹配库位 → 只显示该库位上的 SKU；
   * 否则精确匹配 SKU 或条码 → 只显示该 SKU 的库位；
   * 否则同时做库位和 SKU/条码的部分匹配。
   * 不会截取扫码结果的任何字符。
   */
  function search(records, mode, query) {
    var raw = String(query == null ? '' : query);
    var q = normalize(raw);
    var result = {
      query: raw.trim(),
      q: q,
      mode: mode || 'auto',
      resolvedMode: mode || 'auto',
      exact: [],
      partial: [],
      exactLoc: [],
      exactSku: [],
      partialLoc: [],
      partialSku: []
    };
    if (!q) return result;

    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (r.locL === q) result.exactLoc.push(r);
      else if (r.locL.indexOf(q) >= 0) result.partialLoc.push(r);
      if (r.skuL === q || r.barL === q) result.exactSku.push(r);
      else if (r.skuL.indexOf(q) >= 0 || r.barL.indexOf(q) >= 0) result.partialSku.push(r);
    }

    if (mode === 'loc') {
      result.resolvedMode = 'loc';
      result.exact = result.exactLoc;
      result.partial = result.partialLoc;
    } else if (mode === 'sku') {
      result.resolvedMode = 'sku';
      result.exact = result.exactSku;
      result.partial = result.partialSku;
    } else if (result.exactLoc.length) {
      result.resolvedMode = 'loc';
      result.exact = result.exactLoc;
      result.partial = [];
    } else if (result.exactSku.length) {
      result.resolvedMode = 'sku';
      result.exact = result.exactSku;
      result.partial = [];
    } else {
      result.resolvedMode = 'both';
      result.exact = [];
      result.partial = [];
    }
    return result;
  }

  function resultRows(parts) {
    if (!parts) return [];
    if (parts.resolvedMode === 'both') {
      var seen = {};
      var out = [];
      var lists = [parts.partialLoc || [], parts.partialSku || []];
      for (var i = 0; i < lists.length; i++) {
        for (var j = 0; j < lists[i].length; j++) {
          var row = lists[i][j];
          var key = row.sku + '\0' + row.location + '\0' + row.prop;
          if (seen[key]) continue;
          seen[key] = 1;
          out.push(row);
        }
      }
      return out;
    }
    return (parts.exact || []).concat(parts.partial || []);
  }

  function resultTotals(parts) {
    var list = resultRows(parts);
    var t = 0, a = 0, l = 0;
    for (var i = 0; i < list.length; i++) {
      t += list[i].total;
      a += list[i].avail;
      l += list[i].locked;
    }
    return { n: list.length, total: t, avail: a, locked: l };
  }

  /**

    if (engEl) engEl.removeEventListener('click', onEngClick);
    if (C._session === mySession) C._stop = null;
  }
  var mySession = (C._session || 0);
  C._stop = cleanup;

  top(L.sw_opening); engineLabel();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr({ name: 'SecurityError', message: 'navigator.mediaDevices unavailable' });
    return;
  }
  // 摄像头和识别引擎并行准备；原生优先，WASM 在后台加载作补充/备用
  var zxP = initZx();
  initNative().then(function (ok) {
    if (ok) { engine = 'native'; engineLabel(); return; }
    return zxP.then(function (ok2) {
      if (ok2) { engine = 'wasm'; engineLabel(); }
      else { stopCam(); top(''); msg('<div>' + escH(L.sw_lib) + '</div>'); }
    });
  });
  startCam('');
}
</script>
<script>
/* fest7 库位查询页面逻辑 */
(function () {
  'use strict';

  var ZXING_BASES = [
    'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/',
    'https://unpkg.com/zxing-wasm@3.1.6/'
  ];

  var SCAN_L = {
    sw_title: '扫码 - 库位查询',
    sw_opening: '正在打开摄像头…',
    sw_aim: '请将条码 / 二维码对准取景框',
    sw_switch: '切换摄像头',
    sw_torch: '手电筒',
    cancel: '关闭',
    sw_done: '已识别',
    sw_back: '已识别',
    sw_lib: '扫码组件加载失败，请检查网络后关闭重试。',
    sw_retry: '重试',
    sw_err: '无法打开摄像头。',
    sw_e_NotAllowedError: '摄像头权限被拒绝：请点地址栏左侧的图标，把「摄像头」改为允许，然后点重试。',
    sw_e_NotFoundError: '没有找到摄像头。',
    sw_e_NotReadableError: '摄像头正被其他应用或网页占用，请关闭后重试。',
    sw_e_OverconstrainedError: '没有合适的后置摄像头，请点「切换摄像头」或重试。',
    sw_e_SecurityError: '当前浏览器不允许网页使用摄像头，请用系统浏览器（Chrome 或 Safari）通过 https 打开。',
    sw_e_other: '请重试；如果仍然不行，请把下面的错误信息截图发给管理员。',
    sw_engine: '识别引擎：',
    sw_eng_native: '原生 BarcodeDetector',
    sw_eng_wasm: 'ZXing-WASM',
    sw_eng_loading: '加载中…',
    sw_zoom: '变焦',
    sw_hint: '条码横放在框内，距离约 10–20 厘米；点画面可对焦',
    sw_focus: '对焦'
  };

  var MULTI_KEY = 'kuwei_multi_sku';
  var SYNC_INTERVAL_MS = 10 * 60 * 1000;

  var DATA = null;
  var records = [];
  var mode = 'auto';
  var lastSearch = null;
  var session = 0;
  var blocks = [];
  var flashIndex = -1;
  var syncTimer = null;
  var syncing = false;

  var qEl = document.getElementById('q');
  var clearBtn = document.getElementById('clear');
  var resultEl = document.getElementById('result');
  var summaryEl = document.getElementById('summary');
  var overlay = document.getElementById('scanOverlay');
  var scanPanel = document.getElementById('scanResult');
  var continuousMain = document.getElementById('continuous');
  var continuousScan = document.getElementById('bCont');
  var scanBtn = document.getElementById('scanBtn');
  var httpsWarn = document.getElementById('httpsWarn');
  var dataTimeEl = document.getElementById('dataTime');
  var dataMetaEl = document.getElementById('dataMeta');
  var syncBtn = document.getElementById('syncBtn');
  var syncStatus = document.getElementById('syncStatus');
  var multiEl = document.getElementById('multiSku');
  var multiBar = document.getElementById('multiBar');
  var multiCount = document.getElementById('multiCount');
  var multiClear = document.getElementById('multiClear');
  var modeBtns = {
    auto: document.getElementById('mode-auto'),
    sku: document.getElementById('mode-sku'),
    loc: document.getElementById('mode-loc')
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { return Number(n).toLocaleString('zh-CN'); }

  function placeholderFor(m) {
    if (m === 'sku') return '输入或扫描 SKU / 条码';
    if (m === 'loc') return '输入或扫描库位编号';
    return '扫描或输入 SKU、条码或库位';
  }

  function isMulti() {
    return !!(multiEl && multiEl.checked);
  }

  function readMultiPref() {
    try { return localStorage.getItem(MULTI_KEY) === '1'; } catch (e) { return false; }
  }
  function writeMultiPref(on) {
    try { localStorage.setItem(MULTI_KEY, on ? '1' : '0'); } catch (e) {}
  }

  function setMode(next, rerender) {
    mode = next;
    Object.keys(modeBtns).forEach(function (k) {
      modeBtns[k].setAttribute('aria-pressed', k === mode ? 'true' : 'false');
    });
    qEl.placeholder = placeholderFor(mode);
    if (rerender !== false) {
      if (isMulti()) {
        blocks = LookupCore.refreshBlocks(blocks, records, mode);
        renderAccumulate();
      } else {
        render();
      }
      focusQuery(false);
    }
  }

  function focusQuery(selectAll) {
    try {
      qEl.focus();
      if (selectAll && qEl.value) qEl.select();
    } catch (e) {}
  }

  function isSecure() {
    try { return !!window.isSecureContext; } catch (e) { return location.protocol === 'https:'; }
  }

  function updateHttpsWarn() {
    if (!httpsWarn) return;
    if (isSecure()) {
      httpsWarn.hidden = true;
      return;
    }
    httpsWarn.hidden = false;
    httpsWarn.textContent = '扫码需要在 https 下打开（file:// 或未加密的网页无法调用摄像头）。请把这个站点放到 https 后再用手机扫码。';
  }

  function sums(list) {
    return {
      n: list.length,
      sku: unique(list, 'sku'),
      loc: unique(list, 'location'),
      t: list.reduce(function (a, r) { return a + r.total; }, 0),
      a: list.reduce(function (a, r) { return a + r.avail; }, 0),
      l: list.reduce(function (a, r) { return a + r.locked; }, 0)
    };
  }
  function unique(list, key) {
    var s = {};
    for (var i = 0; i < list.length; i++) s[list[i][key]] = 1;
    return Object.keys(s).length;
  }

  function chips(s, label) {
    return '<div class="sum-row">' +
      (label ? '<div class="chip">' + label + '</div>' : '') +
      '<div class="chip">匹配记录 <b>' + fmt(s.n) + '</b></div>' +
      '<div class="chip">涉及 SKU <b>' + fmt(s.sku) + '</b></div>' +
      '<div class="chip">涉及库位 <b>' + fmt(s.loc) + '</b></div>' +
      '<div class="chip">总库存合计 <b>' + fmt(s.t) + '</b></div>' +
      '<div class="chip">可用合计 <b>' + fmt(s.a) + '</b></div>' +
      '<div class="chip">锁定合计 <b>' + fmt(s.l) + '</b></div>' +
    '</div>';
  }

  function skuBtn(s) {
    return '<button type="button" class="linkish sku" data-jump="sku" data-val="' + esc(s) + '">' + esc(s) + '</button>';
  }
  function locBtn(s) {
    return '<button type="button" class="linkish loc" data-jump="loc" data-val="' + esc(s) + '">' + esc(s) + '</button>';
  }
  function propBadge(prop) {
    return prop === '次品' ? '<span class="badge def">次品</span>' : '<span class="badge ok">正品</span>';
  }
  function barCell(r) {
    return r.barcode !== r.sku ? '<span class="bar">' + esc(r.barcode) + '</span>' : '<span class="sub">' + esc(r.barcode) + '</span>';
  }

  var MAX = 400;

  function card(r, view) {
    var main, sub;
    if (view === 'loc') {
      main = locBtn(r.location);
      sub = skuBtn(r.sku);
    } else {
      main = skuBtn(r.sku);
      sub = locBtn(r.location);
    }
    return '<article class="card">' +
      '<div class="card-top"><div class="card-main">' + main + '</div><div class="card-qty"><b>' + fmt(r.avail) + '</b><span>可用</span></div></div>' +
      '<div class="card-sub">' + sub + (r.barcode !== r.sku ? ' · 条码 ' + esc(r.barcode) : '') + '</div>' +
      '<div class="card-name">' + esc(r.name) + '</div>' +
      '<div class="card-meta">' + esc(r.area) + ' · ' + esc(r.customer) + ' · ' + propBadge(r.prop) + '</div>' +
      '<div class="card-nums"><span>总库存 <b>' + fmt(r.total) + '</b></span><span>锁定 <b>' + fmt(r.locked) + '</b></span></div>' +
    '</article>';
  }

  function renderList(list, view) {
    if (!list.length) return '';
    var shown = list.slice(0, MAX);
    var more = list.length > MAX ? '<p class="hint">仅显示前 ' + MAX + ' 条，请缩小关键词或使用更完整的编号。</p>' : '';
    var cards = '<div class="cards">' + shown.map(function (r) { return card(r, view); }).join('') + '</div>';
    var cols, rowHtml;
    if (view === 'loc') {
      cols = ['库位', '库区', 'SKU', '条码', '品名', '客户', '库存属性', '总库存', '可用', '锁定'];
      rowHtml = function (r) {
        return '<tr><td>' + locBtn(r.location) + '</td><td>' + esc(r.area) + '</td><td>' + skuBtn(r.sku) + '</td><td>' + barCell(r) + '</td><td>' + esc(r.name) + '</td><td class="col-hide">' + esc(r.customer) + '</td><td>' + propBadge(r.prop) + '</td><td class="num">' + fmt(r.total) + '</td><td class="num">' + fmt(r.avail) + '</td><td class="num">' + fmt(r.locked) + '</td></tr>';
      };
    } else {
      cols = ['SKU', '条码', '品名', '库位', '库区', '客户', '库存属性', '总库存', '可用', '锁定'];
      rowHtml = function (r) {
        return '<tr><td>' + skuBtn(r.sku) + '</td><td>' + barCell(r) + '</td><td>' + esc(r.name) + '</td><td>' + locBtn(r.location) + '</td><td>' + esc(r.area) + '</td><td class="col-hide">' + esc(r.customer) + '</td><td>' + propBadge(r.prop) + '</td><td class="num">' + fmt(r.total) + '</td><td class="num">' + fmt(r.avail) + '</td><td class="num">' + fmt(r.locked) + '</td></tr>';
      };
    }
    var table = '<div class="table-wrap"><table><thead><tr>' + cols.map(function (c) {
      var cls = c === '客户' ? ' class="col-hide"' : (['总库存', '可用', '锁定'].indexOf(c) >= 0 ? ' class="num"' : '');
      return '<th' + cls + '>' + c + '</th>';
    }).join('') + '</tr></thead><tbody>' + shown.map(rowHtml).join('') + '</tbody></table></div>';
    return more + cards + table;
  }

  function perSkuTable(list) {
    var map = {};
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var cur = map[r.sku] || { name: r.name, t: 0, a: 0, l: 0, n: 0 };
      cur.t += r.total; cur.a += r.avail; cur.l += r.locked; cur.n += 1;
      map[r.sku] = cur;
    }
    var keys = Object.keys(map);
    if (keys.length <= 1) return '';
    keys.sort(function (x, y) { return map[y].t - map[x].t; });
    var show = keys.slice(0, 30);
    return '<p class="hint">按 SKU 汇总数量' + (keys.length > 30 ? '（前 30 个，共 ' + keys.length + ' 个 SKU）' : '（共 ' + keys.length + ' 个 SKU）') + '</p>' +
      '<div class="table-wrap"><table><thead><tr><th>SKU</th><th>品名</th><th class="num">库位数</th><th class="num">总库存</th><th class="num">可用</th><th class="num">锁定</th></tr></thead><tbody>' +
      show.map(function (s) {
        var v = map[s];
        return '<tr><td>' + skuBtn(s) + '</td><td>' + esc(v.name) + '</td><td class="num">' + fmt(v.n) + '</td><td class="num">' + fmt(v.t) + '</td><td class="num">' + fmt(v.a) + '</td><td class="num">' + fmt(v.l) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function emptyHtml() {
    if (isMulti()) {
      return '<div class="empty">已打开「多SKU连续查询」。每次扫码或回车会在下方追加一条结果，不会覆盖上一条。再扫下一个 SKU，它的库位会显示在上一条下面。</div>';
    }
    return '<div class="empty">扫描或输入关键词开始查询。默认「自动识别」：完整库位号会只显示该库位上的 SKU（例如 BB-1-4-2 不会和 BBB-1-4-2 混在一起）；完整 SKU 或条码会只显示该 SKU 的库位。也可以手动选择「搜 SKU」或「搜库位」。扫码枪扫完回车即查，结果会自动全选方便再扫。</div>';
  }

  function renderResultBody(parts) {
    if (parts.resolvedMode !== 'both') {
      var all = parts.exact.concat(parts.partial);
      if (!all.length) {
        return {
          head: '',
          body: '<div class="empty">没有找到匹配的记录。<span class="query-echo">' + esc(parts.query) + '</span></div>'
        };
      }
      var view = parts.resolvedMode;
      var head = '';
      if (parts.exact.length && parts.partial.length) {
        head = chips(sums(parts.exact), '精确匹配') + chips(sums(parts.partial), '其他部分匹配') +
          (view === 'sku' ? perSkuTable(parts.exact) : '');
      } else {
        var label = parts.exact.length ? '精确匹配' : '部分匹配';
        var list = parts.exact.length ? parts.exact : parts.partial;
        head = chips(sums(list), label) + (view === 'sku' ? perSkuTable(list) : '');
      }
      if (mode === 'auto') {
        head = '<div class="resolved">' + (view === 'loc' ? '已按<strong>库位</strong>精确匹配' : '已按<strong>SKU / 条码</strong>精确匹配') +
          ' · ' + esc(parts.query) + '</div>' + head;
      }
      var body = '';
      if (parts.exact.length) body += '<h2>精确匹配（' + fmt(parts.exact.length) + '）</h2>' + renderList(parts.exact, view);
      if (parts.partial.length) body += '<h2>部分匹配（' + fmt(parts.partial.length) + '）</h2>' + renderList(parts.partial, view);
      return { head: head, body: body };
    }

    var locN = parts.partialLoc.length, skuN = parts.partialSku.length;
    if (!locN && !skuN) {
      return {
        head: '',
        body: '<div class="empty">没有找到匹配的记录。<span class="query-echo">' + esc(parts.query) + '</span></div>'
      };
    }
    return {
      head: '<div class="resolved">未精确命中，已同时搜索库位和 SKU / 条码 · ' + esc(parts.query) + '</div>' +
        (locN ? chips(sums(parts.partialLoc), '库位部分匹配') : '') +
        (skuN ? chips(sums(parts.partialSku), 'SKU / 条码部分匹配') + perSkuTable(parts.partialSku) : ''),
      body: (locN ? '<h2>库位部分匹配（' + fmt(locN) + '）</h2>' + renderList(parts.partialLoc, 'loc') : '') +
        (skuN ? '<h2>SKU / 条码部分匹配（' + fmt(skuN) + '）</h2>' + renderList(parts.partialSku, 'sku') : '')
    };
  }

  function renderFrom(parts, query) {
    lastSearch = parts;
    clearBtn.hidden = !query;
    if (!String(query || '').trim()) {
      summaryEl.innerHTML = '';
      resultEl.innerHTML = emptyHtml();
      return parts;
    }
    var rendered = renderResultBody(parts);
    summaryEl.innerHTML = rendered.head;
    resultEl.innerHTML = rendered.body;
    return parts;
  }

  function render() {
    var query = qEl.value;
    var parts = LookupCore.search(records, mode, query);
    return renderFrom(parts, query);
  }

  function updateMultiBar() {
    if (!multiBar) return;
    var on = isMulti();
    multiBar.hidden = !on;
    if (multiCount) multiCount.textContent = '已查询 ' + fmt(blocks.length) + ' 个';
    if (multiClear) multiClear.disabled = !blocks.length;
  }

  function blockHeader(entry) {
    var totals = LookupCore.resultTotals(entry.parts);
    var viewHint = '';
    if (entry.parts.resolvedMode === 'loc') viewHint = '库位';
    else if (entry.parts.resolvedMode === 'sku') viewHint = 'SKU / 条码';
    return '<div class="acc-head">' +
      '<h2><span class="acc-k">' + (viewHint ? esc(viewHint) + ' ' : '') + '</span><span class="acc-code">' + esc(entry.query) + '</span></h2>' +
      '<div class="acc-qty">总库存 <b>' + fmt(totals.total) + '</b><span> · 可用 ' + fmt(totals.avail) + '</span></div>' +
    '</div>';
  }

  function renderAccumulate(actionInfo) {
    updateMultiBar();
    clearBtn.hidden = !String(qEl.value || '').trim() && !blocks.length;
    if (!blocks.length) {
      summaryEl.innerHTML = '';
      resultEl.innerHTML = emptyHtml();
      return;
    }
    summaryEl.innerHTML = '';
    var html = '';
    for (var i = 0; i < blocks.length; i++) {
      var entry = blocks[i];
      var rendered = renderResultBody(entry.parts);
      var flash = (actionInfo && actionInfo.action === 'flash' && actionInfo.index === i) || flashIndex === i;
      html += '<section class="acc-block' + (flash ? ' flash' : '') + '" data-key="' + esc(entry.key) + '" data-index="' + i + '">' +
        blockHeader(entry) + rendered.head + rendered.body +
      '</section>';
    }
    resultEl.innerHTML = html;
    flashIndex = -1;
    if (actionInfo && (actionInfo.action === 'flash' || actionInfo.action === 'append') && actionInfo.index >= 0) {
      var el = resultEl.querySelector('.acc-block[data-index="' + actionInfo.index + '"]');
      if (el && el.scrollIntoView) {
        try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
      }
    }
  }

  function commitQuery(text, fromScan) {
    if (text != null) qEl.value = String(text);
    var query = qEl.value;
    var parts = LookupCore.search(records, mode, query);
    lastSearch = parts;
    if (isMulti()) {
      if (!String(query || '').trim()) {
        renderAccumulate();
      } else {
        var acc = LookupCore.accumulate(blocks, parts);
        blocks = acc.blocks;
        renderAccumulate(acc);
      }
    } else {
      renderFrom(parts, query);
    }
    if (fromScan) compactPanel(parts);
    focusQuery(true);
    return parts;
  }

  function compactPanel(parts) {
    if (!scanPanel) return;
    var q = parts && parts.query;
    if (!q) { scanPanel.hidden = true; scanPanel.innerHTML = ''; return; }
    var list, view, title;
    if (parts.resolvedMode === 'loc' && parts.exact.length) {
      list = parts.exact; view = 'loc'; title = '库位 ' + q;
    } else if (parts.resolvedMode === 'sku' && parts.exact.length) {
      list = parts.exact; view = 'sku'; title = 'SKU / 条码 ' + q;
    } else if (parts.resolvedMode === 'both') {
      var n = parts.partialLoc.length + parts.partialSku.length;
      if (!n) {
        scanPanel.hidden = false;
        scanPanel.innerHTML = '<div class="sp-miss">未找到 <b>' + esc(q) + '</b></div>';
        return;
      }
      scanPanel.hidden = false;
      scanPanel.innerHTML = '<div class="sp-title">部分匹配 <b>' + esc(q) + '</b></div>' +
        '<div class="sp-sum">库位 ' + fmt(parts.partialLoc.length) + ' 条 · SKU ' + fmt(parts.partialSku.length) + ' 条</div>';
      return;
    } else {
      list = parts.exact.concat(parts.partial);
      if (!list.length) {
        scanPanel.hidden = false;
        scanPanel.innerHTML = '<div class="sp-miss">未找到 <b>' + esc(q) + '</b></div>';
        return;
      }
      view = parts.resolvedMode === 'loc' ? 'loc' : 'sku';
      title = (view === 'loc' ? '库位 ' : 'SKU ') + q + '（部分匹配）';
    }
    var s = sums(list);
    var rows = list.slice(0, 8).map(function (r) {
      var left = view === 'loc' ? r.sku : r.location;
      return '<div class="sp-row"><span class="sp-key">' + esc(left) + '</span><span class="sp-name">' + esc(r.name) + '</span><span class="sp-qty">' + fmt(r.avail) + '</span></div>';
    }).join('');
    var more = list.length > 8 ? '<div class="sp-more">还有 ' + (list.length - 8) + ' 条，关闭扫码后查看全部</div>' : '';
    scanPanel.hidden = false;
    scanPanel.innerHTML = '<div class="sp-title">' + esc(title) + '</div>' +
      '<div class="sp-sum">记录 ' + fmt(s.n) + ' · SKU ' + fmt(s.sku) + ' · 库位 ' + fmt(s.loc) + ' · 可用合计 <b>' + fmt(s.a) + '</b></div>' +
      rows + more;
  }

  function applyQuery(text, fromScan) {
    return commitQuery(text, fromScan);
  }

  function syncContinuous(from) {
    var on = !!(from || continuousMain).checked;
    if (continuousMain) continuousMain.checked = on;
    if (continuousScan) continuousScan.checked = on;
    var lab = document.getElementById('contLabel');
    if (lab) lab.textContent = on ? '连续扫描：开' : '连续扫描';
  }

  function closeScanner() {
    if (window.__DD_CFG && typeof window.__DD_CFG._stop === 'function') {
      try { window.__DD_CFG._stop(); } catch (e) {}
    }
    overlay.hidden = true;
    document.body.classList.remove('scanning');
    if (scanPanel) { scanPanel.hidden = true; }
    focusQuery(true);
  }

  function openScanner() {
    if (!isSecure()) {
      updateHttpsWarn();
      httpsWarn.hidden = false;
      httpsWarn.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (window.__DD_CFG && typeof window.__DD_CFG._stop === 'function') {
      try { window.__DD_CFG._stop(); } catch (e) {}
    }
    session += 1;
    syncContinuous(continuousMain);
    if (scanPanel) { scanPanel.hidden = true; scanPanel.innerHTML = ''; }
    overlay.hidden = false;
    document.body.classList.add('scanning');
    var force = '';
    try { force = localStorage.getItem('dd_scan_engine') || ''; } catch (e) {}
    window.__DD_CFG = {
      zx: ZXING_BASES,
      L: SCAN_L,
      force: force,
      _session: session,
      continuous: function () { return !!(continuousScan && continuousScan.checked) || !!(continuousMain && continuousMain.checked); },
      onSuccess: function (text) {
        applyQuery(text, true);
      },
      onClose: closeScanner,
      onCancel: closeScanner
    };
    scannerMain();
  }

  function displayTime(meta) {
    if (!meta) return '';
    return LookupCore.formatSnapshot(meta.snapshotAt || meta.exportedAt, meta.timeZone || 'Europe/Rome');
  }

  function updateMetaUI() {
    var meta = DATA && DATA.meta;
    if (dataTimeEl) {
      dataTimeEl.innerHTML = meta && (meta.snapshotAt || meta.exportedAt)
        ? '数据更新时间：<b>' + esc(displayTime(meta)) + '</b>'
        : '数据更新时间：<b>—</b>';
    }
    if (dataMetaEl) {
      var n = meta && meta.rowCount != null ? fmt(meta.rowCount) : '0';
      var wh = (meta && (meta.warehouseLabel || meta.warehouse)) || 'fest7';
      dataMetaEl.innerHTML = '共 <strong>' + n + '</strong> 条 · 仓库 ' + esc(wh) + ' · 来自领星 WMS「按库位查询」导出，非实时数据。含客户名称和库存，请不要公开发布。';
    }
    var stats = document.getElementById('stats');
    if (stats && meta) {
      stats.innerHTML =
        '<span>SKU <b>' + fmt(meta.uniqueSkus) + '</b></span>' +
        '<span>库位 <b>' + fmt(meta.uniqueLocations) + '</b></span>' +
        '<span>客户 <b>' + fmt(meta.uniqueCustomers) + '</b></span>' +
        '<span>库区 <b>' + fmt(meta.uniqueAreas) + '</b></span>' +
        '<span>正品 <b>' + fmt(meta.genuineCount) + '</b> · 次品 <b>' + fmt(meta.defectiveCount) + '</b></span>';
    }
  }

  function setSyncStatus(text, kind) {
    if (!syncStatus) return;
    syncStatus.textContent = text || '';
    syncStatus.className = kind ? 'is-' + kind : '';
  }

  function applyData(data) {
    DATA = data;
    records = LookupCore.buildRecords(DATA);
    updateMetaUI();
    if (isMulti() && blocks.length) {
      blocks = LookupCore.refreshBlocks(blocks, records, mode);
      renderAccumulate();
    } else if (String(qEl.value || '').trim()) {
      render();
    } else {
      summaryEl.innerHTML = '';
      resultEl.innerHTML = emptyHtml();
    }
  }

  function fetchData() {
    return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('data.json ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!LookupCore.isValidData(data)) throw new Error('data.json 格式无效');
      return data;
    });
  }

  function readFallback() {
    var el = document.getElementById('payload');
    var raw = el && el.textContent;
    if (!raw || !raw.trim() || raw.trim() === 'null') return null;
    try {
      var data = JSON.parse(raw);
      return LookupCore.isValidData(data) ? data : null;
    } catch (e) {
      return null;
    }
  }

  function syncData(opts) {
    opts = opts || {};
    if (syncing) return Promise.resolve();
    syncing = true;
    if (syncBtn) {
      syncBtn.disabled = true;
      syncBtn.textContent = '同步中…';
    }
    if (!opts.silentIfSame) setSyncStatus('正在同步…', 'muted');
    return fetchData().then(function (incoming) {
      var cmp = DATA ? LookupCore.compareSnapshots(DATA.meta, incoming.meta) : 'newer';
      if (cmp === 'newer') {
        applyData(incoming);
        setSyncStatus(LookupCore.syncStatusText('newer', incoming.meta), 'ok');
      } else if (!opts.silentIfSame) {
        setSyncStatus(LookupCore.syncStatusText(cmp, DATA ? DATA.meta : incoming.meta), 'muted');
      } else {
        setSyncStatus('', '');
      }
    }).catch(function (e) {
      if (opts.silentIfSame && DATA) return;
      setSyncStatus('同步失败：' + ((e && e.message) ? e.message : e), 'err');
    }).then(function () {
      syncing = false;
      if (syncBtn) {
        syncBtn.disabled = false;
        syncBtn.textContent = '一键同步';
      }
    });
  }

  function startSyncTimer() {
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(function () { syncData({ silentIfSame: true }); }, SYNC_INTERVAL_MS);
  }

  function onMultiToggle() {
    writeMultiPref(isMulti());
    if (isMulti()) {
      blocks = [];
      flashIndex = -1;
      var q = String(qEl.value || '').trim();
      if (q) {
        var parts = LookupCore.search(records, mode, q);
        var acc = LookupCore.accumulate(blocks, parts);
        blocks = acc.blocks;
      }
      renderAccumulate();
    } else {
      blocks = [];
      flashIndex = -1;
      updateMultiBar();
      render();
    }
    focusQuery(false);
  }

  function clearAccumulate() {
    blocks = [];
    flashIndex = -1;
    qEl.value = '';
    if (scanPanel) { scanPanel.hidden = true; scanPanel.innerHTML = ''; }
    renderAccumulate();
    focusQuery(false);
  }

  // ---------- 事件 ----------
  modeBtns.auto.addEventListener('click', function () { setMode('auto'); });
  modeBtns.sku.addEventListener('click', function () { setMode('sku'); });
  modeBtns.loc.addEventListener('click', function () { setMode('loc'); });

  qEl.addEventListener('input', function () {
    if (isMulti()) {
      clearBtn.hidden = !String(qEl.value || '').trim() && !blocks.length;
      return;
    }
    render();
  });
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitQuery(qEl.value, false);
    }
  });
  clearBtn.addEventListener('click', function () {
    qEl.value = '';
    if (scanPanel) { scanPanel.hidden = true; scanPanel.innerHTML = ''; }
    if (isMulti()) renderAccumulate();
    else render();
    focusQuery(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!overlay.hidden) { closeScanner(); return; }
      if (document.activeElement === qEl) {
        qEl.value = '';
        if (isMulti()) renderAccumulate();
        else render();
      }
    }
  });

  resultEl.addEventListener('click', onJump);
  summaryEl.addEventListener('click', onJump);
  function onJump(e) {
    var btn = e.target.closest('[data-jump]');
    if (!btn) return;
    var val = btn.getAttribute('data-val');
    var jump = btn.getAttribute('data-jump');
    if (mode === 'auto') applyQuery(val, false);
    else applyQueryAndMode(jump, val);
  }
  function applyQueryAndMode(nextMode, val) {
    setMode(nextMode, false);
    applyQuery(val, false);
  }

  scanBtn.addEventListener('click', function () {
    try { /* iOS 解锁音频需在用户点击时 */ } catch (e) {}
    openScanner();
  });
  if (continuousMain) continuousMain.addEventListener('change', function () { syncContinuous(continuousMain); });
  if (continuousScan) continuousScan.addEventListener('change', function () { syncContinuous(continuousScan); });
  if (multiEl) multiEl.addEventListener('change', onMultiToggle);
  if (multiClear) multiClear.addEventListener('click', clearAccumulate);
  if (syncBtn) syncBtn.addEventListener('click', function () { syncData({ silentIfSame: false }); });

  function boot(data, note) {
    applyData(data);
    updateHttpsWarn();
    setMode('auto', false);
    if (multiEl) {
      multiEl.checked = readMultiPref();
      updateMultiBar();
    }
    if (isMulti()) renderAccumulate();
    else render();
    focusQuery(false);
    if (note) setSyncStatus(note, 'muted');
    startSyncTimer();
  }

  function showLoadError(err) {
    updateHttpsWarn();
    if (dataTimeEl) dataTimeEl.innerHTML = '数据更新时间：<b>—</b>';
    resultEl.innerHTML = '<div class="empty">无法加载库存数据。请确认本目录下有 data.json，并用 https 打开本页。' +
      '<br><button type="button" id="retryLoad" class="retry-btn">重新加载</button>' +
      '<br><small>' + esc(err && err.message ? err.message : err) + '</small></div>';
    var btn = document.getElementById('retryLoad');
    if (btn) btn.addEventListener('click', function () { startLoad(); });
  }

  function startLoad() {
    if (resultEl && !DATA) resultEl.innerHTML = '<div class="empty">正在加载库存数据…</div>';
    fetchData().then(function (data) {
      boot(data);
    }).catch(function (e) {
      var fb = readFallback();
      if (fb) {
        boot(fb, '未能获取最新上传，已使用页面内备份数据。');
        return;
      }
      showLoadError(e);
    });
  }

  startLoad();
})();
</script>
</body>
</html>
