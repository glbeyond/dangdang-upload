<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>dangdang 影像记录 · 内部管理</title>
<style>
  :root { --pri:#1a73e8; --ok:#188038; --err:#d93025; --warn:#b06000; --bg:#f4f6f9; --card:#fff; --line:#dfe3ea; --txt:#1f2328; --sub:#667085; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; }
  header { position:relative; background:var(--pri); color:#fff; padding:14px 16px 0; padding-top:max(14px, env(safe-area-inset-top)); }
  header .in { max-width:1180px; margin:0 auto; position:relative; padding-right:110px; padding-bottom:12px; }
  .lang { position:absolute; right:0; top:0; display:flex; border:1px solid rgba(255,255,255,.7); border-radius:18px; overflow:hidden; }
  .lang button { border:0; background:transparent; color:#fff; font-size:14px; font-weight:600; padding:0 12px; min-height:34px; min-width:44px; }
  .lang button.on { background:#fff; color:var(--pri); }
  header h1 { margin:0; font-size:19px; }
  header p { margin:2px 0 0; font-size:13px; opacity:.85; }
  nav { max-width:1180px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; }
  nav button { border:0; background:transparent; color:rgba(255,255,255,.85); font-size:15px; font-weight:600; padding:10px 14px; border-radius:10px 10px 0 0; white-space:nowrap; }
  nav button.on { background:var(--bg); color:var(--pri); }
  main { padding:14px 12px 40px; max-width:1180px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card h2 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card h2 .sp { flex:1; }
  label.f { display:block; font-weight:600; margin:0 0 4px; font-size:13px; color:var(--sub); }
  input[type=text], input[type=date], input[type=password], select { width:100%; font-size:15px; padding:9px 10px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--txt); font-family:inherit; }
  input:focus, select:focus { outline:2px solid rgba(26,115,232,.35); border-color:var(--pri); }
  button { font:inherit; cursor:pointer; }
  .btn { min-height:40px; padding:0 14px; border:0; border-radius:10px; font-size:15px; font-weight:600; background:#e8eaed; color:var(--txt); white-space:nowrap; }
  .btn.pri { background:var(--pri); color:#fff; } .btn.ok { background:#e6f4ea; color:var(--ok); }
  .btn.sm { min-height:32px; font-size:13px; padding:0 10px; border-radius:8px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > .grow { flex:1; min-width:0; }
  .grid-f { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; align-items:end; }
  .hint { color:var(--sub); font-size:13px; }
  .muted { color:var(--sub); }
  .hidden { display:none !important; }
  a { color:var(--pri); text-decoration:none; } a:hover { text-decoration:underline; }
  .cabs { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .cab { border:2px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; text-align:left; }
  .cab.on { border-color:var(--pri); background:#f3f7ff; }
  .cab b { font-size:18px; } .cab .s { font-size:13px; color:var(--sub); margin-top:2px; }
  .prog { height:6px; background:#eceff3; border-radius:3px; overflow:hidden; margin-top:8px; }
  .prog i { display:block; height:100%; background:var(--ok); }
  .tag { display:inline-block; font-size:12px; font-weight:700; padding:1px 7px; border-radius:10px; background:#eef1f5; color:var(--sub); white-space:nowrap; }
  .tag.exc { background:#fde7e9; color:var(--err); } .tag.ok { background:#e6f4ea; color:var(--ok); } .tag.warn { background:#fef7e0; color:var(--warn); }
  .tag.t0 { background:#e8f0fe; color:#1967d2; } .tag.t1 { background:#e6f4ea; color:#137333; } .tag.t2 { background:#f3e8fd; color:#8430ce; } .tag.t3 { background:#fde7e9; color:#c5221f; }
  .tw { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:7px 9px; border-bottom:1px solid #eef0f3; text-align:left; white-space:nowrap; vertical-align:middle; }
  th { background:#f8f9fb; font-size:13px; color:var(--sub); position:sticky; top:0; z-index:1; }
  tr.clk { cursor:pointer; } tr.clk:hover td { background:#f6f9ff; }
  td.c, th.c { text-align:center; } td.wrap { white-space:normal; min-width:140px; max-width:320px; word-break:break-word; }
  .yes { color:var(--ok); font-weight:700; } .no { color:#c4c9d0; } .exc { color:var(--err); font-weight:700; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .fchip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:4px 12px; font-size:13px; font-weight:600; color:var(--txt); }
  .fchip.on { border-color:var(--pri); background:#e8f0fe; color:var(--pri); }
  .bcard { border-radius:12px; padding:12px; font-size:14px; background:#e6f4ea; border:1px solid #b7dfc2; margin-top:10px; }
  .bcard.miss { background:#fef7e0; border-color:#f6d77a; color:#7a5300; }
  .bcard .g { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px 14px; }
  .bcard .g div span { display:block; font-size:12px; color:var(--sub); } .bcard .g div b { word-break:break-word; }
  .pick { display:inline-block; margin:6px 6px 0 0; }
  .scaninfo { font-size:13px; margin-top:6px; color:var(--sub); word-break:break-all; } .scaninfo b { color:var(--txt); } .scaninfo.warn { color:var(--warn); }
  .tl-day { font-weight:700; margin:14px 0 6px; color:var(--sub); font-size:13px; }
  .tl { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .it { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
  .it.it-exc { border-color:#f4b7bd; }
  .th { position:relative; aspect-ratio:4/3; background:#1f2328; cursor:zoom-in; display:flex; align-items:center; justify-content:center; color:#fff; overflow:hidden; }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .th .ph { font-size:34px; opacity:.75; text-align:center; }
  .th .play + .ph, .th .ph.v { padding-top:70px; }
  .th .ph small { display:block; font-size:11px; opacity:.8; margin-top:4px; padding:0 8px; }
  .th .play { position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; font-size:20px; pointer-events:none; }
  .it .bd { padding:8px 10px; font-size:13px; display:flex; flex-direction:column; gap:3px; }
  .it .bd .l1 { display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .it .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--sub); font-size:12px; }
  .it .note { word-break:break-word; }
  .it .lk { display:flex; gap:10px; font-size:13px; margin-top:2px; }
  .mini { width:56px; height:42px; border-radius:6px; object-fit:cover; background:#1f2328; display:block; }
  .mini.ph { display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
  .counts { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .empty { text-align:center; color:var(--sub); padding:30px 10px; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #c6d3ea; border-top-color:var(--pri); border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .err-box { background:#fde7e9; color:var(--err); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px; word-break:break-word; }
  .ok-box { background:#e6f4ea; color:var(--ok); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px; }
  .gate { max-width:440px; margin:40px auto; }
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.86); z-index:70; display:flex; flex-direction:column; }
  .lb .top { display:flex; align-items:center; gap:10px; padding:10px 14px; color:#fff; font-size:14px; }
  .lb .top .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb .top a { color:#8ab4f8; }
  .lb .stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:0 50px 14px; position:relative; }
  .lb .stage img { max-width:100%; max-height:100%; object-fit:contain; }
  .lb .stage iframe { width:min(100%, 1000px); height:100%; border:0; background:#000; border-radius:8px; }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:60px; border:0; border-radius:8px; background:rgba(255,255,255,.15); color:#fff; font-size:24px; }
  .lb .nav.p { left:6px; } .lb .nav.n { right:6px; }
  .lb .x { border:0; background:rgba(255,255,255,.15); color:#fff; width:36px; height:36px; border-radius:18px; font-size:18px; }
  .lb .cap { color:#ddd; font-size:13px; text-align:center; padding:0 14px 12px; }
  .ver { text-align:center; font-size:11px; color:#9aa0a6; margin-top:14px; }
  .ver a { color:#1a73e8; text-decoration:none; cursor:pointer; }
  .clog-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  .clog { background:#fff; width:100%; max-width:640px; max-height:80vh; overflow:auto; border-radius:16px 16px 0 0;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  .clog h2 { font-size:18px; margin:0 0 4px; display:flex; justify-content:space-between; align-items:center; }
  .clog .own { font-size:13px; color:#5f6368; margin-bottom:10px; }
  .clog .v { border-top:1px solid #eee; padding:10px 0; }
  .clog .v b { font-size:15px; } .clog .v span { font-size:12px; color:#9aa0a6; margin-left:6px; }
  .clog ul { margin:6px 0 0; padding-left:20px; font-size:14px; line-height:1.55; color:#202124; }
  .clog-x { border:0; background:#f1f3f4; border-radius:18px; width:36px; height:36px; font-size:18px; color:#5f6368; }
  .toast { position:fixed; left:50%; top:20px; transform:translateX(-50%); background:rgba(32,33,36,.92); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:15px; z-index:80; max-width:90%; text-align:center; display:none; }
  @media (max-width:600px) { .lb .stage { padding:0 4px 10px; } .lb .nav { display:none; } th, td { padding:6px 7px; } }
</style>
</head>
<body>
<header>
  <div class="in">
    <h1 data-i18n="title">dangdang 影像记录 · 内部管理</h1>
    <p data-i18n="subtitle">查询各柜批次的数量确认、打托、出货和异常影像留档</p>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </div>
  <nav id="tabs" class="hidden">
    <button type="button" data-tab="overview" data-i18n="tab_overview">柜号总览</button>
    <button type="button" data-tab="batch" data-i18n="tab_batch">批次详情</button>
    <button type="button" data-tab="search" data-i18n="tab_search">记录搜索</button>
    <button type="button" data-tab="settings" data-i18n="tab_settings">设置</button>
  </nav>
</header>

<main>
  <section class="card gate hidden" id="gate">
    <h2 data-i18n="gate_title">请输入管理口令</h2>
    <div class="hint" data-i18n="gate_hint">口令只保存在本机浏览器里，下次打开不用重新输入。</div>
    <div class="row" style="margin-top:10px">
      <input type="password" id="keyIn" class="grow" autocomplete="current-password" data-i18n-ph="ph_key" placeholder="管理口令">
      <button type="button" class="btn pri" id="keyBtn" data-i18n="gate_btn">进入</button>
    </div>
    <div id="gateMsg"></div>
  </section>

  <section id="p-overview" class="hidden">
    <div class="card">
      <h2><span data-i18n="ov_cabs">柜号列表</span><span class="sp"></span>
        <button type="button" class="btn sm" id="ovReload" data-i18n="reload">刷新</button></h2>
      <div id="cabList"></div>
    </div>
    <div class="card hidden" id="cabCard">
      <h2><span id="cabTitle"></span><span class="sp"></span>
        <button type="button" class="btn sm ok" id="cabExport" data-i18n="export">导出 Excel</button></h2>
      <div class="filters" id="cabFilters">
        <button type="button" class="fchip on" data-f="all" data-i18n="f_all">全部</button>
        <button type="button" class="fchip" data-f="missing" data-i18n="f_missing">缺记录</button>
        <button type="button" class="fchip" data-f="none" data-i18n="f_none">未上传</button>
        <button type="button" class="fchip" data-f="exc" data-i18n="f_exc">有异常</button>
        <button type="button" class="fchip" data-f="notlist" data-i18n="f_notlist">不在清单</button>
        <select id="cabCh" style="width:auto;padding:5px 8px;font-size:13px"></select>
        <input type="text" id="cabQ" style="width:220px;padding:5px 10px;font-size:13px" data-i18n-ph="ph_filter" placeholder="筛选批次号 / 收件人 / 城市">
      </div>
      <div id="cabBody"></div>
    </div>
  </section>

  <section id="p-batch" class="hidden">
    <div class="card">
      <label class="f" for="bIn" data-i18n="f_batch">批次号</label>
      <div class="row">
        <input type="text" id="bIn" class="grow" maxlength="80" data-i18n-ph="ph_batch" placeholder="输入或扫码" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn pri" id="scanBtn">📷 <span data-i18n="scan">扫码</span></button>
        <button type="button" class="btn" id="bGo" data-i18n="query">查询</button>
      </div>
      <div class="scaninfo hidden" id="scanInfo"></div>
      <div id="bInfo"></div>
    </div>
    <div class="card hidden" id="bTimelineCard">
      <h2><span data-i18n="timeline">影像时间线</span><span class="muted" id="bCount" style="font-weight:400;font-size:13px"></span><span class="sp"></span>
        <button type="button" class="btn sm ok" id="bExport" data-i18n="export">导出 Excel</button></h2>
      <div class="filters" id="bTypeF"></div>
      <div id="bTimeline"></div>
    </div>
  </section>

  <section id="p-search" class="hidden">
    <div class="card">
      <div class="grid-f">
        <div><label class="f" for="sFrom" data-i18n="s_from">开始日期</label><input type="date" id="sFrom"></div>
        <div><label class="f" for="sTo" data-i18n="s_to">结束日期</label><input type="date" id="sTo"></div>
        <div><label class="f" for="sCab" data-i18n="c_cabinet">柜号</label><input type="text" id="sCab" list="cabDl" data-i18n-ph="ph_all" placeholder="全部"><datalist id="cabDl"></datalist></div>
        <div><label class="f" for="sCh" data-i18n="c_channel">渠道</label><select id="sCh"></select></div>
        <div><label class="f" for="sType" data-i18n="c_type">拍摄类型</label><select id="sType"></select></div>
        <div><label class="f" for="sOp" data-i18n="c_operator">操作人</label><input type="text" id="sOp" data-i18n-ph="ph_all" placeholder="全部"></div>
        <div><label class="f" for="sBatch" data-i18n="f_batch">批次号</label><input type="text" id="sBatch" data-i18n-ph="ph_part" placeholder="可输入部分"></div>
        <div class="row"><button type="button" class="btn pri grow" id="sGo" data-i18n="search">搜索</button><button type="button" class="btn" id="sReset" data-i18n="reset">清空</button></div>
      </div>
    </div>
    <div class="card hidden" id="sResCard">
      <h2><span id="sCount"></span><span class="sp"></span><button type="button" class="btn sm ok" id="sExport" data-i18n="export">导出 Excel</button></h2>
      <div id="sBody"></div>
    </div>
  </section>

  <section id="p-settings" class="hidden">
    <div class="card">
      <h2 data-i18n="set_ret">影像留存期限</h2>
      <div class="row" style="max-width:520px">
        <select id="retSel" class="grow"></select>
        <button type="button" class="btn pri" id="retSave" data-i18n="save">保存</button>
      </div>
      <div class="hint" style="margin-top:6px" data-i18n="set_ret_hint">默认不限。目前只保存这个设置，不会自动删除或归档任何文件。</div>
      <div id="retMsg"></div>
    </div>
    <div class="card">
      <h2 data-i18n="set_share">影像查看权限</h2>
      <div id="shareState" class="hint"></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        <button type="button" class="btn" id="sharePub" data-i18n="share_pub">设为「知道链接的任何人可查看」</button>
        <button type="button" class="btn" id="sharePriv" data-i18n="share_priv">改回仅自己可见</button>
      </div>
      <div class="hint" style="margin-top:6px" data-i18n="share_hint"></div>
      <div id="shareMsg"></div>
    </div>
    <div class="card">
      <h2 data-i18n="set_links">相关链接</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <a id="lnSheet" target="_blank" rel="noopener" data-i18n="ln_sheet">上传记录与批次清单（Google 表格）</a>
        <a id="lnFolder" target="_blank" rel="noopener" data-i18n="ln_folder">影像文件夹（Google Drive）</a>
        <a id="lnUpload" target="_blank" rel="noopener" data-i18n="ln_upload">员工上传页</a>
      </div>
      <div style="margin-top:12px"><button type="button" class="btn" id="logout" data-i18n="logout">退出（清除本机保存的口令）</button></div>
      <div class="hint" id="beVer" style="margin-top:6px"></div>
    </div>
  </section>

  <div class="ver"><span id="ver"></span> · <span id="owner"></span> · <a id="clogBtn" role="button" tabindex="0"></a></div>
</main>

<div class="toast" id="toast"></div>
<div class="lb hidden" id="lb">
  <div class="top"><span class="t" id="lbT"></span><a id="lbOpen" target="_blank" rel="noopener"></a><button type="button" class="x" id="lbX" aria-label="Close">×</button></div>
  <div class="stage" id="lbStage"></div>
  <div class="cap" id="lbCap"></div>
</div>
<div class="clog-mask hidden" id="clogMask"><div class="clog" role="dialog" aria-modal="true">
  <h2><span id="clogTitle"></span><button type="button" class="clog-x" id="clogClose" aria-label="Close">×</button></h2>
  <div class="own" id="clogOwner"></div>
  <div id="clogBody"></div>
</div></div>
<script>

  'use strict';

  // 本地测试时可用 ?api=… 指向测试后端（只在 localhost 生效）

  function doSearch() {
    var f = { from: $('sFrom').value, to: $('sTo').value, cabinet: $('sCab').value.trim(), channel: $('sCh').value,
              type: $('sType').value, operator: $('sOp').value.trim(), batch: $('sBatch').value.trim() };
    var my = (state.sSeq = (state.sSeq || 0) + 1);
    state.searchLoading = true; state.searchErr = null; renderSearch();
    api('searchRecords', f).then(function (r) { if (my === state.sSeq) state.search = r; })
      .catch(function (e) { if (my === state.sSeq) state.searchErr = e; })
      .then(function () { if (my === state.sSeq) { state.searchLoading = false; renderSearch(); } });
  }
  $('sGo').addEventListener('click', doSearch);
  each(document, '#p-search input', function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); }); });
  $('sReset').addEventListener('click', function () {
    ['sFrom', 'sTo', 'sCab', 'sOp', 'sBatch'].forEach(function (id) { $(id).value = ''; }); $('sCh').value = ''; $('sType').value = '';
  });
  function renderSearch() {
    var card = $('sResCard'), body = $('sBody');
    if (!state.searchLoading && !state.searchErr && !state.search) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    if (state.searchLoading || state.searchErr) {
      $('sCount').textContent = ''; $('sExport').disabled = true;
      body.innerHTML = state.searchLoading ? loadingHtml() : errHtml(state.searchErr); return;
    }
    var r = state.search, recs = r.records || [];
    $('sCount').textContent = t('s_count', r.total) + (r.truncated ? t('s_trunc', recs.length) : '');
    $('sExport').disabled = !recs.length;
    if (!recs.length) { body.innerHTML = '<div class="empty">' + esc(t('s_none')) + '</div>'; return; }
    body.innerHTML = '<div class="tw"><table><thead><tr><th>' + [t('c_thumb'), t('c_time'), t('c_cabinet'), t('c_channel'), t('c_batch'), t('c_type'), t('c_operator'), t('c_note'), t('c_file')].map(esc).join('</th><th>') +
      '</th></tr></thead><tbody>' + recs.map(function (x, i) {
        return '<tr><td>' + thumbHtml(x, i, true) + '</td><td>' + esc(x.time) + '</td><td>' + esc(x.cabinet) + '</td><td>' + esc(chLabel(x.channel)) + '</td>' +
          '<td><a href="#batch/' + encodeURIComponent(x.batch) + '/' + encodeURIComponent(x.cabinet) + '" data-b="' + esc(x.batch) + '" data-c="' + esc(x.cabinet) + '" class="bl">' + esc(x.batch) + '</a></td>' +
          '<td><span class="tag ' + (ST_CLASS[x.type] || '') + '">' + esc(stLabel(x.type)) + '</span></td><td>' + esc(x.operator) + '</td><td class="wrap">' + esc(x.note) + '</td>' +
          '<td>' + (x.fileUrl ? '<a href="' + esc(x.fileUrl) + '" target="_blank" rel="noopener">' + esc(t('open')) + '</a>' : '') + ' <span class="muted">' + esc(x.sizeMB ? x.sizeMB + 'MB' : '') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
    bindThumbs(body, recs);
    each(body, 'a.bl', function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); gotoBatch(a.getAttribute('data-b'), a.getAttribute('data-c')); });
    });
  }
  $('sExport').addEventListener('click', function () {
    var r = state.search; if (!r || !r.records.length) return;
    exportXlsx('dangdang_records_' + today() + '.xlsx', [{ name: t('x_sheet_rec'), aoa: recordsAoa(r.records), links: true }]);
  });

  // ---------- 设置 ----------
  var RET_OPTS = [0, 3, 6, 12, 24, 36, 60];
  function loadSettings() {
    state.settingsErr = null;
    $('shareState').innerHTML = '<span class="spin"></span>' + esc(t('loading'));
    api('getSettings').then(function (s) { state.settings = s; }).catch(function (e) { state.settingsErr = e; }).then(renderSettings);
  }
  function retLabel(n) { return n ? t('ret_n', n) : t('ret_0'); }
  function renderSettings() {
    var s = state.settings || {};
    var cur = s.retentionMonths || 0, opts = RET_OPTS.indexOf(cur) >= 0 ? RET_OPTS : RET_OPTS.concat([cur]);
    $('retSel').innerHTML = opts.map(function (n) { return '<option value="' + n + '"' + (n === cur ? ' selected' : '') + '>' + esc(retLabel(n)) + '</option>'; }).join('');
    if (state.settingsErr) $('shareState').innerHTML = errHtml(state.settingsErr);
    else if (state.settings) {
      var sh = s.folderSharing || 'UNKNOWN';
      $('shareState').textContent = t('share_state', I18N.zh['share_' + sh] ? t('share_' + sh) : sh);
      $('sharePub').disabled = sh === 'ANYONE_WITH_LINK'; $('sharePriv').disabled = sh === 'PRIVATE';
    }
    var v = s.version || state.beVersion;
    $('beVer').textContent = v ? t('be_ver', v) : '';
  }
  $('retSave').addEventListener('click', function () {
    var btn = this; btn.disabled = true; $('retMsg').innerHTML = '';
    api('setSettings', { retentionMonths: Number($('retSel').value) }).then(function (s) {
      state.settings = s; renderSettings();
      $('retMsg').innerHTML = '<div class="ok-box">' + esc(t('saved')) + ' · ' + esc(t('ret_cur', retLabel(s.retentionMonths))) + '</div>';
    }).catch(function (e) { $('retMsg').innerHTML = errHtml(e); }).then(function () { btn.disabled = false; });
  });
  function setShare(pub) {
    if (!confirm(t(pub ? 'share_confirm_pub' : 'share_confirm_priv'))) return;
    $('shareMsg').innerHTML = '<div class="hint" style="margin-top:8px"><span class="spin"></span>' + esc(t('loading')) + '</div>';
    api('setSettings', { publicView: pub }).then(function (s) { state.settings = s; renderSettings(); $('shareMsg').innerHTML = '<div class="ok-box">' + esc(t('saved')) + '</div>'; })
      .catch(function (e) { $('shareMsg').innerHTML = errHtml(e); });
  }
  $('sharePub').addEventListener('click', function () { setShare(true); });
  $('sharePriv').addEventListener('click', function () { setShare(false); });
  $('lnSheet').href = SHEET_URL; $('lnFolder').href = FOLDER_URL; $('lnUpload').href = UPLOAD_URL;

  // ---------- Excel 导出（SheetJS，在浏览器本地生成 .xlsx，文件链接可点击） ----------
  function today() { var d = new Date(), p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
  function numOr(v) { var n = Number(v); return v !== '' && v != null && !isNaN(n) ? n : (v || ''); }
  var REC_COLS = ['c_time', 'c_cabinet', 'c_channel', 'c_attr', 'c_batch', 'c_recipient', 'c_city', 'c_type', 'c_operator', 'c_note', 'c_file', 'c_mime', 'c_size', 'c_link', 'c_folder'];
  var LINK_COLS = [13, 14];
  function recordsAoa(recs) {
    return [REC_COLS.map(function (k) { return t(k); })].concat(recs.map(function (x) {
      return [x.time, x.cabinet, x.channel, x.attribute, x.batch, x.recipient, x.city, x.type, x.operator, x.note, x.fileName, x.mime, numOr(x.sizeMB), x.fileUrl, x.folderUrl];
    }));
  }
  var xlsxP = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxP) return xlsxP;
    xlsxP = XLSX_URLS.reduce(function (p, url) {
      return p.catch(function () {
        return new Promise(function (res, rej) {
          var s = document.createElement('script'); s.src = url; s.async = true;
          s.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error('xlsx')); };
          s.onerror = function () { s.remove(); rej(new Error('xlsx')); };
          document.head.appendChild(s);
        });
      });
    }, Promise.reject(new Error('start'))).catch(function (e) { xlsxP = null; throw e; });
    return xlsxP;
  }
  function exportXlsx(fileName, sheets) {
    if (!sheets.some(function (s) { return s.aoa.length > 1; })) { toast('x_empty'); return Promise.resolve(); }
    toast('x_loading');
    return loadXlsx().then(function (X) {
      var wb = X.utils.book_new();
      sheets.forEach(function (s) {
        var ws = X.utils.aoa_to_sheet(s.aoa);
        ws['!cols'] = s.aoa[0].map(function (h, c) {
          var m = String(h).length * 2;
          for (var r = 1; r < Math.min(s.aoa.length, 300); r++) m = Math.max(m, String(s.aoa[r][c] == null ? '' : s.aoa[r][c]).length);
          return { wch: Math.min(Math.max(m + 2, 8), 60) };
        });
        if (s.links) LINK_COLS.forEach(function (c) {
          for (var r = 1; r < s.aoa.length; r++) {
            var v = s.aoa[r][c], ref = X.utils.encode_cell({ r: r, c: c });
            if (v && ws[ref]) ws[ref].l = { Target: String(v) };
          }
        });
        ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: s.aoa.length - 1, c: s.aoa[0].length - 1 } }) };
        X.utils.book_append_sheet(wb, ws, String(s.name).slice(0, 31));
      });
      X.writeFile(wb, fileName);
      toast('x_done', fileName);
    }).catch(function () { toast('x_fail'); });
  }

  // ---------- 切换语言：只重绘文字，不丢失已加载的数据 ----------
  function applyLang(l) {
    lang = l === 'en' ? 'en' : 'zh';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    each(document, '[data-i18n]', function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    each(document, '[data-i18n-ph]', function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
    each(document, '.lang button', function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    document.title = t('title');
    $('ver').textContent = t('footer', VERSION);
    $('owner').textContent = (lang === 'en' ? 'Site owner: ' : '网站所有人：') + OWNER;
    $('clogBtn').textContent = lang === 'en' ? 'Version history' : '版本更新记录';
    renderClog(); fillSearchSelects();
    renderCabs(); renderCab(); renderBatch(); renderScanInfo(); renderSearch(); renderSettings();
    if (!$('gate').classList.contains('hidden') && $('gateMsg').querySelector('.err-box')) { /* 保留错误提示 */ }
    if (!$('lb').classList.contains('hidden')) renderLb();
  }
  each(document, '.lang button', function (b) { b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); }); });

  // ---------- 版本更新记录 ----------
  function renderClog() {
    var en = lang === 'en';
    $('clogTitle').textContent = en ? 'Version history' : '版本更新记录';
    $('clogOwner').textContent = (en ? 'Site owner: ' : '网站所有人：') + OWNER + (en ? ' · Current version ' : ' · 当前版本 ') + VERSION;
    $('clogBody').innerHTML = CHANGELOG.map(function (e) {
      return '<div class="v"><b>' + esc(e.v) + '</b><span>' + esc(e.d) + '</span><ul>' +
        (en ? e.en : e.zh).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
  }
  function openClog() { $('clogMask').classList.remove('hidden'); }
  function closeClog() { $('clogMask').classList.add('hidden'); }
  $('clogBtn').addEventListener('click', openClog);
  $('clogBtn').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openClog(); } });
  $('clogClose').addEventListener('click', closeClog);
  $('clogMask').addEventListener('click', function (e) { if (e.target === $('clogMask')) closeClog(); });

  applyLang(lang);
  // 手动修改地址栏 # 或点浏览器后退时跳转到对应页面
  window.addEventListener('hashchange', function () { if (adminKey) routeFromHash(); });
  if (adminKey) enterApp(); else showGate('');
})();
</script>
</body>
</html>
